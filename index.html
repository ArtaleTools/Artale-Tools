<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artale 繁中槍手群抽獎輪盤</title>
    <style>
        /* ================================================================
           Design Tokens：色票全部取自原版（標「= 原」），只補同色相明暗階
           ================================================================ */
        :root {
            /* Primary：原版主紅 #ff4757 為基準 */
            --primary: #ff4757;            /* = 原 --primary */
            --primary-400: #ff6b81;        /* = 原按鈕漸層亮端 */
            --primary-600: #e83d4c;        /* 新增：按鈕漸層暗端 */
            --primary-700: #a32d38;        /* = 原按鈕立體底 */
            --primary-900: #3e1f25;        /* = 原背景光暈 */
            --primary-a10: rgba(255, 71, 87, 0.10); /* = 原 hover */
            --primary-a15: rgba(255, 71, 87, 0.15); /* = 原分頁底 */
            --primary-a30: rgba(255, 71, 87, 0.30); /* = 原卡片光暈 */
            --primary-a50: rgba(255, 71, 87, 0.50); /* = 原標題光暈 */

            /* Accent：原版白色流光 */
            --accent: #ffffff;             /* = 原 --accent */

            /* Background / Surface */
            --bg: #0f0f12;                 /* = 原 --bg */
            --card-bg: #1e1e26;            /* = 原 --card-bg */
            --surface-card: rgba(30, 30, 38, 0.95); /* = 原卡片底 */
            --surface-sunken: rgba(0, 0, 0, 0.3);   /* = 原面板底 */
            --surface-field: #121217;      /* = 原輸入框底 */

            /* Border */
            --border: #444;                /* = 原 */
            --border-strong: #555;         /* = 原 */
            --border-subtle: #2a2a33;      /* = 原紀錄分隔線 */
            --highlight: rgba(255, 255, 255, 0.06); /* 新增：表面上緣高光 */

            /* Text */
            --text: #ffffff;               /* = 原 */
            --text-2: #dddddd;             /* = 原 */
            --text-3: #aaaaaa;             /* = 原 */
            --text-4: #888888;             /* = 原 */
            --text-5: #666666;             /* = 原 */

            /* Status（原版） */
            --ok: #2ed573;
            --warn: #ffa502;
            --pill-bg: #333;

            /* Interactive states */
            --hover-tint: var(--primary-a10);
            --active-tint: var(--primary-a15);
            --disabled-bg: #444;           /* = 原停用按鈕 */
            --focus-ring: 0 0 0 3px var(--primary-a30);

            /* Typography（字體家族沿用原版） */
            --font: "PingFang TC", "Microsoft JhengHei", sans-serif;
            --font-num: 'Courier New', monospace;
            --fs-display: 60px;
            --fs-title: 32px;
            --fs-heading: 20px;
            --fs-value: 18px;
            --fs-body: 14px;
            --fs-small: 13px;
            --fs-label: 12px;

            /* Spacing（4px 基準） */
            --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;

            /* Radius */
            --r-sm: 8px; --r-md: 12px; --r-lg: 15px; --r-xl: 24px; --r-pill: 999px;

            /* Elevation */
            --shadow-inset: inset 0 1px 2px rgba(0, 0, 0, 0.45);
            --shadow-panel: inset 0 1px 0 var(--highlight), 0 1px 0 rgba(0, 0, 0, 0.35);
            --shadow-card: 0 0 50px var(--primary-a30), 0 20px 50px rgba(0, 0, 0, 0.45);

            /* Motion */
            --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
            --dur-fast: 0.15s;
            --dur: 0.25s;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes shine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes readyBeat {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes resultIn {
            0% { opacity: 0; transform: translateY(8px) scale(0.92); }
            60% { opacity: 1; transform: translateY(0) scale(1.04); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ---------- 版面 ---------- */
        body {
            font-family: var(--font);
            background-color: var(--bg);
            /* 原版頂部光暈 + 極淡底部回光 + 細點紋理（全為靜態） */
            background-image:
                radial-gradient(circle at 50% -20%, var(--primary-900), var(--bg) 75%),
                radial-gradient(ellipse at 50% 120%, rgba(62, 31, 37, 0.45), transparent 60%),
                radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: auto, auto, 4px 4px;
            background-attachment: fixed;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            padding: var(--sp-6) 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .container {
            position: relative;
            perspective: 1000px;
            width: 90%;
            max-width: 400px;
            z-index: 10;
            animation: cardEntrance 0.8s var(--ease-out) both;
        }

        .card {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 120px),
                var(--surface-card);
            padding: 40px 30px;
            border-radius: var(--r-xl);
            border: 2px solid var(--primary);
            box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            text-align: center;
            position: relative;
        }

        /* ---------- 標題 ---------- */
        .lucky-text {
            background: linear-gradient(110deg, var(--primary) 25%, var(--accent) 45%, var(--primary) 50%, var(--accent) 55%, var(--primary) 75%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            animation: shine 3s linear infinite;
            filter: drop-shadow(0 0 5px var(--primary-a50));
            display: inline-block;
        }

        .subtitle {
            font-size: var(--fs-title);
            line-height: 1.25;
            margin: 6px 0 var(--sp-6);
            letter-spacing: 3px;
            padding-left: 3px; /* 抵銷末字後的字距 */
        }

        h2 {
            color: var(--text);
            margin: 0;
            letter-spacing: 1px;
            padding-left: 1px; /* 抵銷末字後的字距 */
            font-size: var(--fs-heading);
            font-weight: 700;
            line-height: 1.3;
            opacity: 0.8;
        }

        /* ---------- 分頁 ---------- */
        .mode-tabs { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-4); }
        .mode-tab {
            flex: 1; padding: 9px 0; border-radius: 10px; border: 1px solid var(--border);
            background: var(--surface-field); color: var(--text-3);
            font: 700 var(--fs-body)/1.2 var(--font); cursor: pointer;
            box-shadow: inset 0 1px 0 var(--highlight);
            transition: border-color var(--dur), color var(--dur), background-color var(--dur);
        }
        .mode-tab:hover { color: var(--text); border-color: var(--border-strong); }
        .mode-tab:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .mode-tab.active { border-color: var(--primary); color: var(--text); background: var(--primary-a15); }

        /* ---------- 控制面板 ---------- */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--sp-4) 15px;
            margin-bottom: var(--sp-4);
            background: var(--surface-sunken);
            padding: var(--sp-4) 15px;
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-panel);
        }
        .input-grid .group[style] { margin-top: 0 !important; } /* 間距統一由 grid gap 控制 */

        label {
            display: block; font-size: var(--fs-label); font-weight: 700; line-height: 1.4;
            color: var(--text-4); letter-spacing: 0.5px; margin-bottom: 6px; text-align: left;
        }

        .input-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-field);
            border-radius: var(--r-md);
            border: 1px solid var(--border);
            padding: 2px;
            box-shadow: var(--shadow-inset);
            transition: border-color var(--dur), box-shadow var(--dur);
        }
        .input-control:hover { border-color: var(--border-strong); }
        .input-control:focus-within { border-color: var(--primary); box-shadow: var(--shadow-inset), var(--focus-ring); }

        .stepper-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            font: 700 20px/1 var(--font);
            width: 36px;
            height: 36px;
            flex: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            border-radius: var(--r-sm);
            transition: background-color var(--dur-fast), color var(--dur-fast), transform var(--dur-fast);
        }
        .input-control .stepper-btn:last-child { padding-bottom: 4px; } /* 「+」字形偏低，上移 2px */
        .stepper-btn:hover { background: var(--hover-tint); color: var(--primary-400); }
        .stepper-btn:active { background: var(--active-tint); transform: scale(0.9); }
        .stepper-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }

        input {
            width: 40px;
            min-width: 0;
            flex-grow: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: var(--text);
            font: 700 var(--fs-value)/1.2 var(--font);
            font-variant-numeric: tabular-nums;
            text-align: center;
            outline: none;
        }

        /* 隱藏原生箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }

        /* ---------- 排除已中獎 ---------- */
        .exclude-row {
            /* 第一行：勾選框＋已中獎數；第二行：重置 */
            display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 0 14px;
            margin: 0 0 var(--sp-5); padding: var(--sp-3) 15px; font-size: var(--fs-body); font-weight: 700;
            background: var(--surface-sunken); border-radius: var(--r-lg);
            box-shadow: var(--shadow-panel);
        }
        .exclude-row label {
            display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0;
            font-size: var(--fs-body); letter-spacing: 0; text-align: center; cursor: pointer; color: var(--text); user-select: none;
        }
        .exclude-row input[type="checkbox"] {
            appearance: none; -webkit-appearance: none;
            flex: none; width: 22px; height: 22px; margin: 0; padding: 0;
            background: var(--surface-field); border: 1px solid var(--border); border-radius: var(--r-sm);
            box-shadow: var(--shadow-inset);
            display: grid; place-content: center; cursor: pointer;
            transition: border-color var(--dur), background-color var(--dur-fast), box-shadow var(--dur);
        }
        .exclude-row input[type="checkbox"]::after {
            content: ""; width: 10px; height: 6px; margin-top: -2px;
            border-left: 3px solid var(--text); border-bottom: 3px solid var(--text);
            transform: rotate(-45deg) scale(0); transition: transform var(--dur-fast) var(--ease-out);
        }
        .exclude-row input[type="checkbox"]:checked {
            background: linear-gradient(180deg, var(--primary-400), var(--primary));
            border-color: var(--primary); box-shadow: 0 2px 8px var(--primary-a30);
        }
        .exclude-row input[type="checkbox"]:checked::after { transform: rotate(-45deg) scale(1); }
        .exclude-row input[type="checkbox"]:hover { border-color: var(--primary); }
        .exclude-row input[type="checkbox"]:focus-visible { border-color: var(--primary); outline: none; box-shadow: var(--focus-ring); }
        .exclude-row .meta:empty { display: none; }
        .exclude-row .meta { color: var(--text-3); font-size: var(--fs-body); line-height: 1; font-variant-numeric: tabular-nums; }
        .exclude-row::after { content: ""; flex-basis: 100%; order: 1; } /* 換行點 */
        .exclude-row .small-btn { font-size: var(--fs-body); font-weight: 700; order: 2; margin-top: 10px; }

        /* ---------- 抽獎顯示窗（全站視覺核心） ---------- */
        #display {
            position: relative;
            font-size: var(--fs-display);
            color: var(--text);
            margin: var(--sp-5) 0 var(--sp-6);
            padding: var(--sp-3);
            font-family: var(--font-num);
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            min-height: 140px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
            overflow-wrap: anywhere;
            border-radius: 18px;
            /* 內凹視窗：深底 + 底部主色微光，框住號碼 */
            background:
                radial-gradient(ellipse at 50% 120%, var(--primary-a15), transparent 65%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.25));
            border: 1px solid var(--border-subtle);
            box-shadow:
                inset 0 2px 8px rgba(0, 0, 0, 0.6),
                inset 0 -1px 0 var(--highlight);
            transition: border-color var(--dur);
        }
        /* 視窗兩側的指針 */
        #display::before,
        #display::after {
            content: "";
            position: absolute;
            top: var(--pointer-y, 50%);
            width: 0;
            height: 0;
            margin-top: -7px;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            opacity: 0.85;
            transition: opacity var(--dur);
        }
        #display::before { left: 0; border-left: 9px solid var(--primary); }
        #display::after { right: 0; border-right: 9px solid var(--primary); }
        #display:has(.ready-text)::before,
        #display:has(.ready-text)::after { opacity: 0.35; }

        /* 狀態：轉動中 */
        #display:has(.rolling-num) {
            border-color: var(--primary-a50);
            box-shadow:
                inset 0 2px 8px rgba(0, 0, 0, 0.6),
                inset 0 0 24px var(--primary-a15);
        }
        /* 狀態：結果 */
        #display:has(.win-text) { border-color: var(--primary-a50); }

        .ready-text {
            animation: readyBeat 1.5s infinite ease-in-out;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            padding-left: 2px; /* 抵銷末字後的字距 */
        }

        /* 裁掉字型上下留白，數字的排版中心才會等於字形中心，與指針對齊 */
        .ready-text,
        .rolling-num,
        .win-numbers {
            text-box: trim-both cap alphabetic;
        }

        .rolling-num {
            font-size: 70px;
            line-height: 1.2;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        #display { --fs-win: 36px; --lh-win: 1.1; --win-nudge: calc(var(--fs-win) * 0.14); }
        #display:has(.win-text) { padding-bottom: calc(var(--sp-3) + var(--win-nudge)); }
        #display:has(.win-text) { --pointer-y: calc(50% + (var(--fs-win) * var(--lh-win) + var(--sp-2) - var(--win-nudge)) / 2); }
        /* 線上房間結果多一行排序說明（12px × 1.3 + 6px），號碼往上移一半 */
        #display:has(.sort-note) { --pointer-y: calc(50% + (var(--fs-win) * var(--lh-win) + var(--sp-2) - var(--win-nudge)) / 2 - (var(--fs-label) * 1.3 + 6px) / 2); }

        .win-text {
            font-family: var(--font);
            font-size: var(--fs-win);
            line-height: var(--lh-win); /* 縮小行距留白，整組內容在視窗內上下置中 */
            padding-left: 0.36em; /* 全形「！」右半為空白，左側補同寬才會視覺置中 */
            color: var(--text);
            margin-bottom: var(--sp-2);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            animation: resultIn 0.45s var(--ease-out) both;
        }
        .win-numbers.lucky-text {
            line-height: 1.2;
            text-spacing-trim: trim-both;
            /* 漸層字只畫在元素框內；框被裁到字高後，上下各留空間避免筆畫被切掉（對稱，不影響置中） */
            padding: 0.2em 0;
            margin: -0.2em 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.35em 0.33em;
            animation: resultIn 0.5s 0.08s var(--ease-out) both, shine 3s linear infinite;
        }

        /* 每個號碼裁到數字字高，才能和指針精準對齊 */
        .win-num { white-space: nowrap; text-box: trim-both cap alphabetic; }
        /* 「、」字形在字寬中間，右側約 0.33em 是空白：以負邊距收掉，行尾就不會偏左；號碼間距由 gap 補回 */
        .win-sep { display: inline-block; width: 1em; margin-right: -0.33em; }
        .sort-note { font-family: var(--font); font-size: var(--fs-label); line-height: 1.3; font-weight: 400; color: var(--text-4); margin-top: 6px; }

        /* ---------- 主按鈕 ---------- */
        .draw-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(180deg, var(--primary-400), var(--primary) 55%, var(--primary-600));
            border: none;
            color: var(--text);
            font: 700 22px/1.2 var(--font);
            letter-spacing: 2px;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            border-radius: var(--r-lg);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.35),
                0 6px 0 var(--primary-700),
                0 12px 20px rgba(0, 0, 0, 0.35);
            transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), filter var(--dur-fast);
            margin-bottom: var(--sp-5);
            -webkit-tap-highlight-color: transparent;
        }
        .draw-btn:hover:not(:disabled) {
            filter: brightness(1.08);
            transform: translateY(-2px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.35),
                0 8px 0 var(--primary-700),
                0 16px 24px rgba(0, 0, 0, 0.35);
        }
        .draw-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 2px 0 var(--primary-700),
                0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .draw-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        /* 停用即轉動中（Loading） */
        .draw-btn:disabled {
            background: var(--disabled-bg);
            color: var(--text-2);
            text-shadow: none;
            box-shadow: inset 0 1px 0 var(--highlight), 0 6px 0 #2e2e36;
            cursor: not-allowed;
        }

        /* ---------- 次要按鈕與標籤 ---------- */
        .small-btn {
            background: transparent; border: 1px solid var(--border-strong); color: var(--text-2); border-radius: var(--r-sm);
            padding: 6px 10px; font: 400 var(--fs-small)/1.3 var(--font); cursor: pointer; white-space: nowrap;
            transition: border-color var(--dur), color var(--dur), background-color var(--dur);
        }
        .small-btn:hover { border-color: var(--primary); color: var(--text); background: var(--hover-tint); }
        .small-btn:active { background: var(--active-tint); }
        .small-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .small-btn.primary { background: var(--primary); border-color: var(--primary); color: var(--text); font-weight: 700; }
        .small-btn.primary:hover { background: var(--primary-400); border-color: var(--primary-400); }

        .pill { font-size: var(--fs-label); padding: 2px 10px; border-radius: var(--r-pill); background: var(--pill-bg); color: #ccc; white-space: nowrap; }
        .pill.ok { background: rgba(46, 213, 115, 0.2); color: var(--ok); }
        .pill.warn { background: rgba(255, 165, 2, 0.2); color: var(--warn); }
        .pill.bad { background: rgba(255, 71, 87, 0.2); color: var(--primary-400); }

        /* ---------- 線上房間 ---------- */
        .online-panel {
            background: var(--surface-sunken); border-radius: var(--r-lg); padding: var(--sp-3) 15px;
            margin-bottom: var(--sp-4); text-align: left; font-size: var(--fs-small); line-height: 1.5; color: #bbb;
            box-shadow: var(--shadow-panel);
        }
        .online-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); margin: var(--sp-1) 0; flex-wrap: wrap; }
        .room-code { font-family: var(--font-num); color: var(--text); word-break: break-all; }
        #turnstile-box { margin-top: 10px; display: flex; justify-content: center; }

        /* ---------- 其他 ---------- */
        .notice { min-height: 18px; font-size: var(--fs-small); color: var(--warn); margin: -10px 0 var(--sp-3); }
        .history { margin-top: var(--sp-3); text-align: left; font-size: var(--fs-small); }
        .history summary { cursor: pointer; color: #999; }
        .history ol { list-style: none; padding: 0; margin: var(--sp-2) 0 0; max-height: 180px; overflow-y: auto; }
        .history li { padding: 6px 0; border-top: 1px solid var(--border-subtle); color: #ccc; }
        .history .meta { color: #777; font-size: var(--fs-label); }
        .input-grid.locked { opacity: 0.5; pointer-events: none; }

        .footer-note {
            font-size: var(--fs-label);
            color: var(--text-5);
            margin-top: 10px;
            opacity: 0.6;
        }


        /* ---------- 背景裝飾（純裝飾，不攔截點擊；動畫只用 transform / opacity） ---------- */
        @keyframes wheelSpin { to { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(var(--dx, 12px), var(--dy, -24px)); }
        }
        @keyframes gemFloat {
            0%, 100% { transform: translateY(0) rotate(var(--rot, 45deg)); }
            50% { transform: translateY(-16px) rotate(calc(var(--rot, 45deg) + 25deg)); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.7); }
            50% { opacity: 0.9; transform: scale(1); }
        }
        .bg-deco { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        /* 輪盤：呼應「幸運抽獎輪盤」，置於卡片正後方緩慢旋轉 */
        .bg-wheel {
            position: absolute; left: 50%; top: 50%;
            width: min(150vmin, 1200px); height: min(150vmin, 1200px);
            transform: translate(-50%, -50%);
            opacity: 0.55;
            animation: wheelSpin 160s linear infinite;
        }
        /* 柔焦光暈：景深模糊的光斑（以漸層做出柔邊，不用 filter） */
        .bg-bokeh {
            position: absolute; left: var(--x); top: var(--y);
            width: var(--size); height: var(--size); border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 107, 129, 0.55) 0%, rgba(255, 71, 87, 0.25) 35%, rgba(255, 71, 87, 0) 70%);
            opacity: var(--o, 0.35);
            animation: drift var(--dur, 14s) ease-in-out var(--delay, 0s) infinite;
        }
        /* 細線菱形：帶一點高光的鏤空框 */
        .bg-gem {
            position: absolute; left: var(--x); top: var(--y);
            width: var(--size); height: var(--size);
            border: 1px solid rgba(255, 107, 129, 0.45);
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.25), inset 0 0 8px rgba(255, 71, 87, 0.15);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 55%);
            opacity: var(--o, 0.6);
            animation: gemFloat var(--dur, 12s) ease-in-out var(--delay, 0s) infinite;
        }
        /* 星點 */
        .bg-spark {
            position: absolute; left: var(--x); top: var(--y);
            width: 3px; height: 3px; border-radius: 50%;
            background: #fff; box-shadow: 0 0 6px 1px rgba(255, 107, 129, 0.6);
            animation: twinkle var(--dur, 4s) ease-in-out var(--delay, 0s) infinite;
        }
        @media (max-width: 700px) {
            .bg-deco .wide-only { display: none; }
        }

        [hidden] { display: none !important; }

        /* ---------- 響應式 ---------- */
        @media (max-width: 380px) {
            .card { padding: 32px 18px; }

            #display { --fs-display: 48px; }
            .rolling-num { font-size: 56px; }
            #display { --fs-win: 30px; }
        }
    </style>

<script>
    // 數字增減邏輯
    function step(id, val) {
        const input = document.getElementById(id);
        const newValue = parseInt(input.value) + val;
        if (id === 'qty' && newValue < 1) return;
        if (id === 'min' && newValue < 0) return;
        input.value = newValue;
    }

    const $ = (id) => document.getElementById(id);
    const canvas = $('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let pieces = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function fireConfetti() {
        pieces = [];
        const colors = ['#ff4757', '#ffffff', '#a32d38', '#ff6b81'];
        for (let i = 0; i < 150; i++) {
            pieces.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                rotation: Math.random() * 360,
                color: colors[Math.floor(Math.random() * colors.length)],
                size: Math.random() * 10 + 5,
                speed: Math.random() * 8 + 5,
                osc: Math.random() * 2
            });
        }
        updateConfetti();
    }

    function updateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach((p, i) => {
            p.y += p.speed;
            p.x += Math.sin(p.y / 30) * p.osc;
            p.rotation += 5;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation * Math.PI / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
            ctx.restore();
        });
        pieces = pieces.filter(p => p.y < canvas.height);
        if (pieces.length > 0) requestAnimationFrame(updateConfetti);
    }

    // 音效預設開啟：載入時就嘗試啟用；瀏覽器若要求先互動，點畫面任何地方或按任何鍵就會自動開啟。
    let audioCtx = null;
    function ensureAudio() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.onstatechange = updateSoundBtn;
            }
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        } catch {}
        updateSoundBtn();
    }
    function unlockAudio() {
        ensureAudio();
        if (audioCtx && audioCtx.state === 'running') {
            for (const ev of ['pointerdown', 'keydown', 'touchstart']) document.removeEventListener(ev, unlockAudio, true);
        }
    }
    for (const ev of ['pointerdown', 'keydown', 'touchstart']) document.addEventListener(ev, unlockAudio, true);

    // at：音訊時鐘上的播放時間（秒），省略則立即播放
    function playTick(freq, type, duration, at) {
        if (!audioCtx || audioCtx.state !== 'running') return;
        const t = at ?? audioCtx.currentTime;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + duration);
    }

    // 音訊時鐘時間 → 聲音實際從喇叭出來的 performance.now() 時間（含輸出延遲）
    function audioTimeToPerf(t) {
        const ts = audioCtx.getOutputTimestamp ? audioCtx.getOutputTimestamp() : null;
        if (ts && ts.performanceTime > 0) return ts.performanceTime + (t - ts.contextTime) * 1000;
        const latency = (audioCtx.outputLatency || 0) + (audioCtx.baseLatency || 0);
        return performance.now() + (t - audioCtx.currentTime + latency) * 1000;
    }

    function showNumber(text, style, className) {
        const span = document.createElement('span');
        if (style) span.style.cssText = style;
        if (className) span.className = className;
        span.textContent = text;
        $('display').replaceChildren(span);
    }

    function showWinners(winners, note) {
        const title = document.createElement('div');
        title.className = 'win-text';
        title.textContent = '恭喜中獎！';
        const nums = document.createElement('div');
        nums.className = 'win-numbers lucky-text';
        winners.forEach((w, i) => {
            const item = document.createElement('span');
            item.className = 'win-num';
            item.textContent = w;
            if (i < winners.length - 1) {
                const sep = document.createElement('span');
                sep.className = 'win-sep';
                sep.textContent = '、';
                item.append(sep);
            }
            nums.append(item);
        });
        const children = [title, nums];
        if (note) {
            const n = document.createElement('div');
            n.className = 'sort-note';
            n.textContent = note;
            children.push(n);
        }
        $('display').replaceChildren(...children);
    }

    // 原本的跳號動畫：50 次跳號、25 次後震動、結束時彩帶與音效。winners 已由呼叫端決定。
    // 節奏與原版相同（每 50ms 一拍，第 36 拍起每拍再慢 20ms）。音效先排在音訊時鐘上，
    // 數字與抖動在「聲音實際播出」的時間點才更新，畫面與聲音同一拍。
    const ROLL_BEATS = 50;
    function playRoll(vMin, vMax, winners, note, onDone) {
        const card = $('mainCard');
        const beats = [];
        for (let c = 1, t = 0; c <= ROLL_BEATS; t += 50 + 20 * Math.max(0, c - 36), c++) beats.push(t);

        const audioOn = audioCtx && audioCtx.state === 'running';
        const audioStart = audioOn ? audioCtx.currentTime + 0.08 : 0; // 預留排程時間
        const perfStart = audioOn ? audioTimeToPerf(audioStart) : performance.now();
        if (audioOn) {
            beats.forEach((ms, i) => playTick(400 + (i + 1) * 15, 'square', 0.05, audioStart + ms / 1000));
            playTick(150, 'sawtooth', 0.5, audioStart + beats[ROLL_BEATS - 1] / 1000);
        }

        // 鏡頭震動：每拍往隨機方向衝一下，再像彈簧一樣衰減回彈，持續整拍（拍與拍之間連續）。
        // 強度 k 從 0 隨進度遞增；數字同拍放大彈出。
        function shakeCard(k, duration) {
            if (!card.animate) return;
            const a = 0.5 + 9.5 * k, r = 2.2 * k;
            const th = Math.random() * Math.PI * 2, x = Math.cos(th) * a, y = Math.sin(th) * a;
            const rs = Math.random() < 0.5 ? -r : r;
            card.animate([1, -0.6, 0.35, -0.15, 0].map((f, i) => ({
                transform: `translate(${(x * f).toFixed(2)}px, ${(y * f).toFixed(2)}px) rotate(${(rs * f).toFixed(3)}deg)`,
                offset: i / 4,
            })), { duration, easing: 'linear' });
        }
        function popNumber(k) {
            const el = $('display').firstElementChild;
            if (el && el.animate) el.animate([{ transform: `scale(${1 + 0.06 + 0.22 * k})` }, { transform: 'scale(1)' }], { duration: 120, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
        }
        function beatShake(c) {
            const k = (c / (ROLL_BEATS - 1)) ** 1.5;
            shakeCard(k, Math.max(50, beats[c] - beats[c - 1]));
            popNumber(k);
        }

        let next = 0;
        // 推進到現在該有的拍子；回傳是否已結束
        function advance() {
            if (next >= ROLL_BEATS) return true;
            const now = performance.now();
            while (next < ROLL_BEATS && now >= perfStart + beats[next]) {
                const c = ++next;
                if (c < ROLL_BEATS) {
                    // 落後超過一拍（例如分頁在背景）就只補最後一拍，不連續閃動
                    if (next < ROLL_BEATS - 1 && now >= perfStart + beats[next]) continue;
                    showNumber(String(Math.floor(Math.random() * (vMax - vMin + 1)) + vMin), '', 'rolling-num');
                    beatShake(c);
                } else {
                    showWinners(winners, note);
                    shakeCard(1.3, 420); // 結果出現時的最後一震
                    fireConfetti();
                    onDone && onDone();
                }
            }
            return next >= ROLL_BEATS;
        }
        function frame() { if (!advance()) requestAnimationFrame(frame); }
        requestAnimationFrame(frame);
        // 分頁在背景時 requestAnimationFrame 會暫停，用計時器保證結果仍會出現
        setTimeout(advance, perfStart - performance.now() + beats[ROLL_BEATS - 1] + 250);
    }

    function setButton(disabled, text) {
        const btn = $('btn');
        btn.disabled = disabled;
        btn.innerText = text;
    }

    // ---------- 本機抽獎（沿用原邏輯） ----------
    function startLocalDraw() {
        const vMin = parseInt($('min').value),
              vMax = parseInt($('max').value),
              n = parseInt($('qty').value);

        if (isNaN(vMin) || isNaN(vMax) || vMin >= vMax || isNaN(n) || n <= 0 || n > (vMax - vMin + 1)) return alert("設定錯誤");

        setButton(true, "輪盤轉動中...");

        const exclude = $('excludeWon').checked;
        if (exclude && localWonKey !== vMin + ':' + vMax) { localWon.clear(); localWonKey = vMin + ':' + vMax; }
        let pool = Array.from({length: vMax - vMin + 1}, (_, i) => i + vMin);
        if (exclude) pool = pool.filter(v => !localWon.has(v));
        if (n > pool.length) {
            setButton(false, "啟動抽獎");
            updateExcludeInfo();
            return alert(`剩餘可抽號碼只有 ${pool.length} 個，少於抽取數量 ${n}，請按「重置」或調整設定`);
        }
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        const winners = pool.slice(0, n).sort((a,b)=>a-b);
        if (exclude) winners.forEach(w => localWon.add(w));

        playRoll(vMin, vMax, winners, '', () => { setButton(false, "再次啟動抽獎"); updateExcludeInfo(); });
    }

    // ---------- 本機：取消已中獎過的號碼 ----------
    const localWon = new Set();
    let localWonKey = '';
    function updateExcludeInfo() {
        const on = $('excludeWon').checked;
        $('excludeInfo').textContent = on && localWon.size ? `已中獎 ${localWon.size} 個` : '';
        $('excludeResetBtn').hidden = !(on && localWon.size);
    }
    // 範圍改變就視為新一輪，立即清空並更新顯示（不必等到下次抽獎）
    ['min', 'max'].forEach(id => $(id).addEventListener('input', () => {
        if (localWon.size && localWonKey !== parseInt($('min').value) + ':' + parseInt($('max').value)) { localWon.clear(); updateExcludeInfo(); }
    }));
    $('excludeWon').onchange = () => { if (!$('excludeWon').checked) localWon.clear(); updateExcludeInfo(); };
    $('excludeResetBtn').onclick = () => { localWon.clear(); updateExcludeInfo(); };

    function startDraw() {
        ensureAudio();
        if (online.roomId) hostDraw();
        else startLocalDraw();
    }

    // ---------- 線上房間 ----------
    const CONFIG = window.ARTALE_CONFIG || {};
    const API_BASE_URL = (CONFIG.API_BASE_URL || '').trim();
    const TOKEN_PREFIX = 'artale-host-token:';
    const online = {
        roomId: null, kind: null, hostToken: null, version: 0, lastSeq: 0, status: 'idle',
        ws: null, retry: 0, retryTimer: null, pingTimer: null, stopped: false,
        queue: [], animating: false, replaySeq: null, history: [], pendingRequest: null,
    };

    function apiUrl(path) { return new URL(path, API_BASE_URL).toString(); }
    function wsUrl(roomId) {
        const u = new URL(`/api/rooms/${encodeURIComponent(roomId)}/ws`, API_BASE_URL);
        u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
        return u.toString();
    }
    function pageUrl(params) {
        const u = new URL(location.href);
        u.search = '';
        u.hash = '';
        for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
        return u.toString();
    }
    function notice(text) { $('notice').textContent = text || ''; }

    function loadToken(roomId) { try { return localStorage.getItem(TOKEN_PREFIX + roomId); } catch { return null; } }
    function saveToken(roomId, token) { try { localStorage.setItem(TOKEN_PREFIX + roomId, token); } catch {} }
    function clearToken(roomId) { try { localStorage.removeItem(TOKEN_PREFIX + roomId); } catch {} online.hostToken = null; }

    async function apiFetch(path, init) {
        let res;
        try {
            res = await fetch(apiUrl(path), init);
        } catch {
            return { ok: false, status: 0, network: true, body: null };
        }
        let body = null;
        try { body = await res.json(); } catch { /* 平台額度或非 JSON 錯誤 */ }
        return { ok: res.ok, status: res.status, body, retryAfter: res.headers.get('Retry-After') };
    }

    function errorText(r) {
        if (r.network) return '網路錯誤，無法連線到線上服務。';
        if (r.body && r.body.error) return r.body.error.message;
        if (r.status === 503 || r.status >= 500 || !r.body) return '線上服務暫時無法使用（可能是免費額度已用完），請稍後再試。';
        return `發生錯誤（HTTP ${r.status}）。`;
    }

    function setConn(state) {
        online.status = state;
        const pill = $('connPill');
        const map = { connecting: ['連線中', 'warn'], connected: ['已連線', 'ok'], disconnected: ['已斷線・結果未同步', 'bad'], closed: ['已關閉', ''] };
        const [text, cls] = map[state] || [state, ''];
        pill.textContent = text;
        pill.className = 'pill ' + cls;
    }

    function updateSoundBtn() {
        const on = audioCtx && audioCtx.state === 'running';
        const btn = $('soundBtn');
        if (!btn) return;
        btn.textContent = on ? '🔊 音效已開' : '🔇 點畫面任一處開啟音效';
        btn.classList.toggle('primary', !on);
    }

    function isHost() { return !!online.hostToken && online.kind === 'web'; }

    function refreshControls() {
        const inRoom = !!online.roomId;
        const host = isHost();
        const active = online.status !== 'closed';
        $('onlineSetup').hidden = inRoom;
        $('roomInfo').hidden = !inRoom;
        $('historyBox').hidden = !inRoom;
        $('hostRow').hidden = !(host && active);
        $('btn').hidden = inRoom && !(host && active);
        document.querySelector('.input-grid').classList.toggle('locked', inRoom && !(host && active));
        if (!inRoom) return;
        $('roomCode').textContent = online.kind === 'discord' ? 'Discord 頻道' : online.roomId;
        $('roleText').textContent = online.kind === 'discord'
            ? '在 Discord 輸入 /抽獎 即可觸發'
            : (host ? '你是房主' : '觀眾（唯讀）');
    }

    function validDraw(d) {
        return d && Number.isInteger(d.sequence) && Number.isInteger(d.min) && Number.isInteger(d.max)
            && Array.isArray(d.results) && d.results.every(Number.isInteger);
    }

    function sortedResults(d) { return [...d.results].sort((a, b) => a - b); }

    function fmtTime(iso) {
        return new Date(iso).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false });
    }

    function renderHistory() {
        const items = online.history.map((d) => {
            const li = document.createElement('li');
            const nums = document.createElement('div');
            nums.textContent = `#${d.sequence}　${sortedResults(d).join('、')}`;
            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = `${fmtTime(d.createdAt)}・範圍 ${d.min}–${d.max}・${d.count} 個${d.source === 'discord' ? '・Discord' : ''}`;
            li.append(nums, meta);
            return li;
        });
        $('historyList').replaceChildren(...items);
    }

    function enqueueAnimation(draw) {
        online.queue.push(draw);
        if (!online.animating) nextAnimation();
    }

    function showSettings(s) {
        $('min').value = s.min; $('max').value = s.max; $('qty').value = s.count;
    }

    function nextAnimation() {
        const draw = online.queue.shift();
        if (!draw) {
            online.animating = false;
            if (isHost() && online.status !== 'closed' && !online.pendingRequest) setButton(false, "再次啟動抽獎");
            return;
        }
        online.animating = true;
        if (isHost()) setButton(true, "輪盤轉動中...");
        else showSettings(draw);
        playRoll(draw.min, draw.max, sortedResults(draw), `第 ${draw.sequence} 抽・由小到大顯示`, nextAnimation);
    }

    function showStatic(draw) {
        if (draw) showWinners(sortedResults(draw), `第 ${draw.sequence} 抽・由小到大顯示`);
    }

    function applySnapshot(snap) {
        online.kind = snap.kind;
        online.version = snap.version;
        online.lastSeq = snap.lastSequence;
        online.history = (snap.history || []).filter(validDraw);
        if (snap.settings) showSettings(snap.settings);
        if (snap.expiresAt && snap.kind === 'web') $('expiresText').textContent = `到期：${fmtTime(snap.expiresAt)}`;
        renderHistory();
        if (snap.status === 'closed') markClosed('房間已關閉，以下為保留的紀錄。');
        refreshControls();

        if (online.replaySeq !== null) {
            const target = online.history.find((d) => d.sequence === online.replaySeq);
            online.replaySeq = null;
            if (target) { enqueueAnimation(target); return; }
            notice('找不到指定的抽獎紀錄（僅保留最近 100 次）。');
        }
        if (!online.animating) {
            if (snap.latestDraw && validDraw(snap.latestDraw)) showStatic(snap.latestDraw);
            else showNumber(online.kind === 'discord' ? '等待 /抽獎' : 'READY', online.kind === 'discord' ? 'font-size: 40px;' : '', 'ready-text');
        }
    }

    async function resync() {
        const r = await apiFetch(`/api/rooms/${encodeURIComponent(online.roomId)}`, {});
        if (r.ok && r.body) { applySnapshot(r.body); return true; }
        if (r.status === 404 || r.status === 410) {
            markClosed(r.status === 404 ? '找不到房間，請確認連結或建立新房間。' : '房間已過期或已清除。');
            return false;
        }
        return null; // 暫時性錯誤
    }

    function handleDrawEvent(msg) {
        const draw = msg.draw;
        if (!validDraw(draw) || draw.sequence <= online.lastSeq) return; // 去重
        if (draw.sequence > online.lastSeq + 1) {
            // 跳號：先以 snapshot 補齊，再播放這一次
            resync().then(() => enqueueAnimation(draw));
            online.lastSeq = draw.sequence;
            return;
        }
        online.lastSeq = draw.sequence;
        online.version = Math.max(online.version, msg.version || 0);
        online.history = [draw, ...online.history.filter((d) => d.sequence !== draw.sequence)].slice(0, 100);
        renderHistory();
        enqueueAnimation(draw);
    }

    function markClosed(text) {
        online.stopped = true;
        if (online.hostToken) clearToken(online.roomId);
        clearTimeout(online.retryTimer);
        clearInterval(online.pingTimer);
        if (online.ws) { try { online.ws.close(); } catch {} online.ws = null; }
        setConn('closed');
        notice(text);
        refreshControls();
    }

    function connect() {
        if (online.stopped) return;
        setConn('connecting');
        let ws;
        try { ws = new WebSocket(wsUrl(online.roomId)); } catch { scheduleReconnect(); return; }
        online.ws = ws;
        ws.onopen = () => {
            online.retry = 0;
            setConn('connected');
            notice('');
            clearInterval(online.pingTimer);
            online.pingTimer = setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 45000);
        };
        ws.onmessage = (e) => {
            if (e.data === 'pong') return;
            let msg;
            try { msg = JSON.parse(e.data); } catch { return; }
            if (msg.type === 'snapshot') applySnapshot(msg);
            else if (msg.type === 'draw_committed') handleDrawEvent(msg);
            else if (msg.type === 'room_closed') markClosed('房主已關閉房間。');
            else if (msg.type === 'room_expired') markClosed('房間已過期。');
        };
        ws.onclose = async () => {
            clearInterval(online.pingTimer);
            if (online.stopped || online.ws !== ws) return;
            setConn('disconnected');
            // WebSocket 失敗拿不到 HTTP 狀態，先查 snapshot 決定是否該停止重連
            const alive = await resync();
            if (alive === false) return;
            if (online.status === 'closed') return;
            scheduleReconnect();
        };
    }

    function scheduleReconnect() {
        online.retry++;
        if (online.retry > 8) {
            setConn('disconnected');
            notice('多次重連失敗，請重新整理頁面。');
            return;
        }
        const base = Math.min(30000, 1000 * 2 ** (online.retry - 1));
        const delay = base / 2 + Math.random() * base / 2;
        clearTimeout(online.retryTimer);
        online.retryTimer = setTimeout(connect, delay);
    }

    function enterRoom(roomId, replaySeq) {
        online.roomId = roomId;
        online.kind = roomId.startsWith('dc-') ? 'discord' : 'web';
        online.hostToken = online.kind === 'web' ? loadToken(roomId) : null;
        online.replaySeq = replaySeq;
        online.stopped = false;
        selectTab('online');
        refreshControls();
        showNumber('連線中…', 'font-size: 36px;');
        connect();
    }

    async function hostDraw() {
        const vMin = parseInt($('min').value), vMax = parseInt($('max').value), n = parseInt($('qty').value);
        if (isNaN(vMin) || isNaN(vMax) || vMin >= vMax || isNaN(n) || n <= 0 || n > (vMax - vMin + 1)) return alert("設定錯誤");
        if (online.animating || online.pendingRequest) return;

        const request = { requestId: crypto.randomUUID(), expectedVersion: online.version, min: vMin, max: vMax, count: n };
        online.pendingRequest = request;
        setButton(true, "送出中...");
        notice('');
        let r;
        // 逾時／網路錯誤時用「相同 requestId、相同內容」重試，不會多抽一次
        for (let attempt = 0; attempt < 3; attempt++) {
            r = await apiFetch(`/api/rooms/${encodeURIComponent(online.roomId)}/draw`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${online.hostToken}` },
                body: JSON.stringify(request),
            });
            if (!(r.network || (r.status >= 500 && !r.body))) break;
            await new Promise((res) => setTimeout(res, 1000 * (attempt + 1)));
        }
        online.pendingRequest = null;

        if (r.ok && r.body) {
            handleDrawEvent(r.body);
            if (!online.animating) setButton(false, "再次啟動抽獎");
            return;
        }
        notice(errorText(r));
        if (r.status === 409) await resync();
        if (r.status === 401) { clearToken(online.roomId); refreshControls(); notice('房主驗證失敗，已切換為觀眾。'); }
        if (r.status === 410) markClosed('房間已關閉或過期。');
        if (!online.animating) setButton(false, "啟動抽獎");
    }

    // ---------- 建立房間（Turnstile） ----------
    let turnstileReady = null;
    function loadTurnstile() {
        if (turnstileReady) return turnstileReady;
        turnstileReady = new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
            s.async = true;
            s.onload = () => resolve(window.turnstile);
            s.onerror = () => reject(new Error('turnstile'));
            document.head.appendChild(s);
        });
        return turnstileReady;
    }

    async function getTurnstileToken() {
        if (!CONFIG.TURNSTILE_SITE_KEY) return '';
        const ts = await loadTurnstile();
        return new Promise((resolve, reject) => {
            $('turnstile-box').replaceChildren();
            ts.render('#turnstile-box', {
                sitekey: CONFIG.TURNSTILE_SITE_KEY,
                callback: resolve,
                'error-callback': () => reject(new Error('turnstile')),
                'timeout-callback': () => reject(new Error('turnstile')),
                'expired-callback': () => reject(new Error('turnstile')),
            });
        });
    }

    async function createRoom() {
        ensureAudio();
        const btn = $('createRoomBtn');
        btn.disabled = true;
        notice('');
        try {
            let token = '';
            try { token = await getTurnstileToken(); } catch { notice('人機驗證載入失敗，請重試。'); return; }
            const r = await apiFetch('/api/rooms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ turnstileToken: token }),
            });
            if (!r.ok || !r.body || !r.body.roomId) { notice(errorText(r)); return; }
            saveToken(r.body.roomId, r.body.hostToken);
            history.replaceState(null, '', pageUrl({ room: r.body.roomId }));
            $('turnstile-box').replaceChildren();
            enterRoom(r.body.roomId, null);
        } finally {
            btn.disabled = false;
        }
    }

    async function closeRoom() {
        if (!confirm('確定要關閉房間？關閉後無法再抽獎，紀錄保留 7 天。')) return;
        const r = await apiFetch(`/api/rooms/${encodeURIComponent(online.roomId)}/close`, {
            method: 'POST', headers: { Authorization: `Bearer ${online.hostToken}` },
        });
        if (r.ok) markClosed('房間已關閉。');
        else notice(errorText(r));
    }

    async function copyLink() {
        const url = pageUrl({ room: online.roomId });
        try { await navigator.clipboard.writeText(url); notice('已複製觀看連結。'); }
        catch { prompt('複製觀看連結：', url); }
    }

    function selectTab(mode) {
        $('tabLocal').classList.toggle('active', mode === 'local');
        $('tabOnline').classList.toggle('active', mode === 'online');
        $('onlinePanel').hidden = mode !== 'online';
        $('excludeRow').hidden = mode !== 'local';
        if (mode === 'local') {
            $('btn').hidden = false;
            document.querySelector('.input-grid').classList.remove('locked');
            $('historyBox').hidden = true;
            if (!online.animating) setButton(false, "啟動抽獎");
        } else {
            refreshControls();
        }
    }

    function leaveRoom() {
        if (!online.roomId) return;
        online.stopped = true;
        clearTimeout(online.retryTimer);
        clearInterval(online.pingTimer);
        if (online.ws) { try { online.ws.close(); } catch {} online.ws = null; }
        online.roomId = null; online.kind = null; online.hostToken = null; online.queue = [];
        history.replaceState(null, '', pageUrl({}));
        notice('');
        showNumber('READY', '', 'ready-text');
    }

    $('tabLocal').onclick = () => { leaveRoom(); selectTab('local'); };
    $('tabOnline').onclick = () => {
        selectTab('online');
        if (!API_BASE_URL) { $('setupText').textContent = '線上功能尚未設定。'; $('createRoomBtn').hidden = true; }
    };
    $('createRoomBtn').onclick = createRoom;
    $('closeRoomBtn').onclick = closeRoom;
    $('copyBtn').onclick = copyLink;
    $('soundBtn').onclick = ensureAudio;

    // 最後更新日期：GitHub Pages 會帶 Last-Modified，document.lastModified 即為部署時間
    (() => {
        const d = new Date(document.lastModified);
        if (isNaN(d)) return;
        const pad = n => String(n).padStart(2, '0');
        $('lastUpdated').textContent = ` · 最後更新：${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    })();
    ensureAudio(); // 預設開啟（瀏覽器允許時立即生效）

    (function init() {
        const params = new URLSearchParams(location.search);
        const room = params.get('room');
        if (!room) return;
        if (!API_BASE_URL) { selectTab('online'); $('onlineSetup').hidden = false; $('setupText').textContent = '線上功能尚未設定，無法觀看房間。'; $('createRoomBtn').hidden = true; return; }
        if (!/^([A-Za-z0-9_-]{22}|dc-\d{15,21})$/.test(room)) { selectTab('online'); notice('房間連結格式錯誤。'); return; }
        const drawParam = parseInt(params.get('draw'), 10);
        enterRoom(room, Number.isInteger(drawParam) ? drawParam : null);
    })();
</script>

</body>
</html>
